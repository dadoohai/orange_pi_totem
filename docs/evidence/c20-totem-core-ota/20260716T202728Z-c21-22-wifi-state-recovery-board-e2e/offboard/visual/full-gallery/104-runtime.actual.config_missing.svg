  <text x="72" y="392" font-family="Arial, DejaVu Sans, sans-serif" font-size="29" fill="#cbd5e1"><tspan x="72" dy="0">A configuração leva poucos minutos.</tspan></text>
  <text x="72" y="464" font-family="Arial, DejaVu Sans, sans-serif" font-size="22" fill="#9aa4b2"><tspan x="72" dy="0">Segure F10 por 5 segundos para começar.</tspan></text>
