[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = '/tmp/ffbuild/gxx/gxx-wrap'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
pkg-config = 'pkg-config'

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'cortex-a53'
endian = 'little'

[properties]
sys_root = '/tmp/a64/bw'
pkg_config_libdir = '/tmp/ffbuild/prefix/lib/pkgconfig:/tmp/a64/bw/usr/lib/aarch64-linux-gnu/pkgconfig:/tmp/a64/bw/usr/share/pkgconfig'

[built-in options]
c_args = ['--sysroot=/tmp/a64/bw', '-I/tmp/a64/bw/usr/include', '-I/tmp/ffbuild/prefix/include']
c_link_args = ['--sysroot=/tmp/a64/bw', '-L/tmp/a64/bw/usr/lib/aarch64-linux-gnu', '-L/tmp/ffbuild/prefix/lib', '-Wl,-rpath-link,/tmp/a64/bw/usr/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/tmp/a64/bw/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/tmp/ffbuild/prefix/lib']
cpp_args = ['-I/tmp/a64/bw/usr/include', '-I/tmp/ffbuild/prefix/include']
cpp_link_args = ['-static-libstdc++', '-static-libgcc', '/tmp/ffbuild/isoc23_compat.o', '-L/tmp/a64/bw/usr/lib/aarch64-linux-gnu', '-L/tmp/ffbuild/prefix/lib', '-Wl,-rpath-link,/tmp/a64/bw/usr/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/tmp/a64/bw/lib/aarch64-linux-gnu', '-Wl,-rpath-link,/tmp/ffbuild/prefix/lib']
