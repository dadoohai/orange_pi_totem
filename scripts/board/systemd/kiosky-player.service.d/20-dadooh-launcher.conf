# C18 — Redirect kiosky-player.service ExecStart through our wrapper.
#
# Why: the wrapper picks /data/player-runtime/current/kiosk.py if present,
# falling back to /opt/totem/kiosky-player/kiosk.py otherwise.  The wrapper then
# delegates to the original inner launcher (kiosky_service_launcher.sh) via
# `exec`, so the watchdog/status writer/setup-trigger plumbing is preserved.
#
# Notes:
#   - ExecStart is reset first because systemd drop-ins must clear list options
#     before re-defining them.
#   - We do NOT touch User, Group, WorkingDirectory, Environment, ReadOnlyPaths,
#     ReadWritePaths, or any ExecStartPre lines from the base unit.  We add one
#     non-fatal, explicitly authorized player-runtime reconcile step for state
#     hygiene. It is prefixed with `+` because the base service runs as the
#     unprivileged `totem` user while reconcile must manage /data/player-runtime
#     root-owned state. The launcher remains the boot-time fail-closed adoption
#     guard.
#   - The wrapper at /opt/totem/bin/totem-kiosky-launcher.sh must be in place
#     before this drop-in is loaded.  The image installs it.
#   - C18 player-runtime teardown asks mpv to quit over IPC before falling back
#     to process signals.  KillMode=mixed keeps SIGTERM on the Python parent so
#     that graceful IPC path runs, while SendSIGKILL remains enabled to clean up
#     the control group if shutdown stalls.

[Unit]
RequiresMountsFor=/data
After=local-fs.target

[Service]
KillMode=mixed
TimeoutStopSec=90s
SendSIGKILL=yes
ExecStartPre=-+/usr/bin/env C18_PLAYER_RUNTIME_RECONCILE=1 /opt/totem/bin/totem-updatectl reconcile --component player-runtime --allow-player-runtime-maintenance
ExecStart=
ExecStart=/usr/bin/env bash /opt/totem/bin/totem-kiosky-launcher.sh
