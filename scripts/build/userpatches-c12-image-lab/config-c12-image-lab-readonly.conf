# C12.1 image-lab read-only build config.
#
# This file is copied into Armbian Build's userpatches directory and used as:
#
#   ./compile.sh build c12-image-lab-readonly
#
# It intentionally builds a lab image, not a production image.
#
# C12.1.11 requires a full kernel config userpatch named
# userpatches/linux-sunxi64-current.config with CONFIG_OVERLAY_FS=y. The local
# build runner prepares that file from Armbian Build's complete
# config/kernel/linux-sunxi64-current.config when
# C12_KERNEL_OVERLAYFS_BUILTIN=1 is set.

EXPERT=yes
BOARD=orangepizero3
RELEASE=bookworm
BRANCH=current
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
NETWORKING_STACK=network-manager
BSPFREEZE=yes
SHARE_LOGS=no
FORCE_USE_RAMDISK=no

function user_config__dadooh_c12_image_lab_readonly() {
	add_packages_to_image overlayroot mpv ffmpeg python3-requests network-manager
	EXTRA_IMAGE_SUFFIXES+=("-${C12_IMAGE_SUFFIX_MARKER:-c12-ro-lab-c12-1-8}")
}

function dadooh_c13_disable_debian_backports_in_image_lab() {
	local sources_file="${SDCARD}/etc/apt/sources.list.d/debian.sources"
	local marker_file="${SDCARD}/etc/dadooh/c13-homologation-build-apt-policy"
	[[ -f "${sources_file}" ]] || return 0
	python3 - "${sources_file}" "${marker_file}" <<'PY'
from pathlib import Path
import sys

sources = Path(sys.argv[1])
marker = Path(sys.argv[2])
lines = sources.read_text(encoding="utf-8", errors="replace").splitlines()
out = []
changed = False
for line in lines:
    if line.startswith("Suites:"):
        head, values = line.split(":", 1)
        suites = [suite for suite in values.split() if suite != "bookworm-backports"]
        new_line = f"{head}: {' '.join(suites)}"
        changed = changed or new_line != line
        out.append(new_line)
    else:
        out.append(line)
sources.write_text("\n".join(out) + "\n", encoding="utf-8")
marker.parent.mkdir(parents=True, exist_ok=True)
marker.write_text(
    "debian_backports_disabled_for_image_lab_build=true\n"
    "reason=avoid_qemu_chroot_apt_memory_error\n"
    "final_image=false\n",
    encoding="utf-8",
)
marker.chmod(0o644)
PY
}

function post_repo_apt_update() {
	display_alert "Disabling Debian backports for image-lab post-customize update" "bookworm-backports" "info"
	dadooh_c13_disable_debian_backports_in_image_lab
	display_alert "Updating APT package lists" "after customization" "info"
	do_with_retries 3 chroot_sdcard_apt_get_update
}

function apt_lists_copy_from_host_to_image_and_update() {
	display_alert "Copying host-side apt list cache into image" "apt-get update and clean image-side" "info"

	declare -i local_apt_cache_lists_count
	if [[ "${LOCAL_APT_CACHE_INFO[USE]}" == "yes" ]]; then
		run_host_command_logged mkdir -pv "${LOCAL_APT_CACHE_INFO[SDCARD_LISTS_DIR]}"
		display_alert "Copying host-side local apt list cache dir" "${LOCAL_APT_CACHE_INFO[SDCARD_LISTS_DIR]}" "debug"
		run_host_command_logged cp -pr "${LOCAL_APT_CACHE_INFO[HOST_LISTS_DIR]}"/* "${LOCAL_APT_CACHE_INFO[SDCARD_LISTS_DIR]}"/
		run_host_command_logged find "${LOCAL_APT_CACHE_INFO[SDCARD_LISTS_DIR]}" -maxdepth 1 -type f -name '*bookworm-backports*' -delete
		local_apt_cache_lists_count="$(ls -1 "${LOCAL_APT_CACHE_INFO[SDCARD_LISTS_DIR]}" | wc -l)"
		display_alert "After copying host-side cache into image" "${local_apt_cache_lists_count} files" "info"
	fi

	dadooh_c13_disable_debian_backports_in_image_lab
	display_alert "Updating apt lists in image" "apt-get update and clean" "info"
	chroot_sdcard apt-get -y -o "APT::Get::List-Cleanup=1" -o "APT::Clean-Installed=1" update
	chroot_sdcard apt-get -y -o "APT::Get::List-Cleanup=1" -o "APT::Clean-Installed=1" clean

	local_apt_cache_lists_count="$(ls -1 "${LOCAL_APT_CACHE_INFO[SDCARD_LISTS_DIR]}" | wc -l)"
	display_alert "After updating and cleaning image apt list cache" "${local_apt_cache_lists_count} files" "info"
}
