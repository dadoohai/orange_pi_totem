# C12.1 image-lab read-only build config.
#
# This file is copied into Armbian Build's userpatches directory and used as:
#
#   ./compile.sh build c12-image-lab-readonly
#
# It intentionally builds a lab image, not a production image.

EXPERT=yes
BOARD=orangepizero3
RELEASE=bookworm
BRANCH=current
BUILD_MINIMAL=yes
BUILD_DESKTOP=no
KERNEL_CONFIGURE=no
NETWORKING_STACK=network-manager
BSPFREEZE=yes
SHARE_LOGS=no
FORCE_USE_RAMDISK=no

function user_config__dadooh_c12_image_lab_readonly() {
	add_packages_to_image overlayroot mpv ffmpeg python3-requests network-manager
	EXTRA_IMAGE_SUFFIXES+=("-${C12_IMAGE_SUFFIX_MARKER:-c12-ro-lab-c12-1-6}")
}
